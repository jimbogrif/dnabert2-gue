[project]
name = "dnabert2-gue"
version = "0.1.0"
description = "Layer x pooling x classifier sweep of frozen DNABERT-2 embeddings on the GUE benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.7.1",
    "transformers==4.57.6",
    "scikit-learn==1.9.1",
    "peft==0.21.2",
    "numpy",
    "pandas",
    "joblib",
    "matplotlib",
    "seaborn",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
